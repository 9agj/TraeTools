name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build (Release)
        run: dotnet build TraeTools.csproj -c Release --nologo

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trae-tools-build
          path: bin/Release/net9.0-windows/
          if-no-files-found: error