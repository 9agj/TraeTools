name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的重复推送自动取消旧任务，避免浪费 runner 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # 目标框架是 net9.0-windows（Avalonia Desktop + WinForms + WebView2），
    # 必须在 Windows runner 上编译，Linux runner 无法还原这些目标包。
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Show version.json
        shell: bash
        run: |
          echo "version.json => $(tr -d '\n' < version.json)"

      - name: Restore
        run: dotnet restore TraeTools.csproj --nologo

      - name: Build (Release)
        run: dotnet build TraeTools.csproj -c Release --no-restore --nologo

      # csproj 里的 <SelfContained>true</SelfContained> 会让 SDK 把 RID 追加进输出路径
      # （bin/Release/net9.0-windows/win-x64/），所以这里动态定位产物，不硬编码子目录。
      - name: Verify version sync & locate artifacts
        id: artifacts
        shell: pwsh
        run: |
          $json = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $dll = Get-ChildItem -Path "bin/Release" -Recurse -Filter "TraeTools.dll" -ErrorAction SilentlyContinue |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $dll) { throw "未找到构建产物 TraeTools.dll（bin/Release 下）" }

          $asm = [System.Reflection.AssemblyName]::GetAssemblyName($dll.FullName).Version
          Write-Host "产物路径     : $($dll.FullName)"
          Write-Host "version.json : $json"
          Write-Host "程序集版本   : $asm"

          $exp = [System.Version]::Parse($json)
          $ok = ($asm.Major -eq $exp.Major) -and ($asm.Minor -eq $exp.Minor) -and ($asm.Build -eq $exp.Build)
          if (-not $ok) { throw "版本不同步：version.json=$json，程序集=$asm" }
          Write-Host "版本同步校验通过"

          "dir=$($dll.DirectoryName)" >> $env:GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trae-tools-build-${{ github.sha }}
          path: ${{ steps.artifacts.outputs.dir }}/
          if-no-files-found: error
          retention-days: 14
